<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>CAPTCHA 接入示例</title>
<style>
  :root { color-scheme: light dark; font: 16px/1.6 system-ui,sans-serif; background: #f4f5f7; color: #18181b; }
  body { max-width: 800px; margin: 7vh auto; padding: 0 24px; } h1 { letter-spacing: -.04em; font-size: 36px; margin-bottom: 8px; }
  .sub { color: #71717a; } .grid { display: grid; grid-template-columns: 1.3fr 1fr; gap: 20px; margin-top: 28px; }
  section { padding: 24px; border: 1px solid #d4d4d8; border-radius: 22px; background: #fff; }
  h2 { font-size: 18px; margin: 0 0 18px; } label { display: block; margin-bottom: 14px; font-size: 14px; }
  input { display: block; width: 100%; box-sizing: border-box; padding: 10px 12px; border: 1px solid #a1a1aa; border-radius: 10px; font: inherit; background: transparent; color: inherit; }
  button { margin-top: 18px; border: 0; border-radius: 10px; padding: 11px 18px; cursor: pointer; font: inherit; background: #006fee; color: white; }
  button:disabled { opacity: .6; } #result { min-height: 50px; font-size: 14px; margin: 16px 0 0; } a { color: #006fee; }
  @media (max-width: 640px) { .grid { grid-template-columns: 1fr; } body { margin-top: 24px; } }
  @media (prefers-color-scheme: dark) { :root { background: #09090b; color: #f4f4f5; } section { background: #18181b; border-color: #3f3f46; } .sub { color: #a1a1aa; } }
</style></head><body>
<h1>验证，嵌入你的服务。</h1><p class="sub">原生 JavaScript · 行为分析 · 工作量证明 · 图片回正</p>
<p><a href="/">普通 script 示例</a> · <a href="/module">ES module 示例</a></p>
<div class="grid"><section><h2>模拟业务表单</h2><form><label>用户名<input name="username" autocomplete="username"></label><label>备注<input name="note"></label><div id="captcha"></div><button type="submit">验证并提交</button></form><p id="result" role="status"></p></section>
<section><h2>同页第二个组件</h2><p class="sub">独立用途、计算任务和弹窗。两个组件可以同时验证。</p><div id="second-captcha"></div><button id="rebuild" type="button">销毁第二个组件</button></section></div>
<!-- CAPTCHA_SCRIPT -->
</body></html>
